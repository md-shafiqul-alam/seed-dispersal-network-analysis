name: Run Seed-Dispersal Network Analysis

on:
  push:
    branches: [ main ]
    paths:
      - 'R/**'
      - 'data/raw/**'
      - '.github/workflows/run-analysis.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libharfbuzz-dev libfribidi-dev

    - name: Install R packages
      run: |
        Rscript -e "
          packages <- c('dplyr','tidyr','purrr','tibble','bipartite','igraph','tidygraph','ggraph','ggplot2','viridis')
          install.packages(packages, repos = 'https://cloud.r-project.org')
        "

    - name: Run pipeline
      run: Rscript R/00_run_all.R

    - name: Commit and push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generated pipeline results [skip ci]" && git push)
